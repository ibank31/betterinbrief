name: BinB Build
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode ID, contoh Seed_004
        required: true
        default: SmokeTest_000
  push:
    branches:
      - main
    paths:
      - trigger/build-request.json

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      EPISODE: ${{ inputs.episode }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BINB_HOME: /home/runner/binb-home
      BINB_APP_ROOT: ${{ github.workspace }}
      HF_HUB_DISABLE_XET: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tentukan episode (dispatch atau trigger file)
        run: |
          if [ -z "$EPISODE" ]; then
            EP=$(node -p "JSON.parse(require('fs').readFileSync('trigger/build-request.json','utf8')).episode")
            if [ -z "$EP" ] || [ "$EP" = "undefined" ] || [ "$EP" = "null" ]; then
              echo "ERROR: trigger/build-request.json tidak berisi field episode yang valid"
              exit 1
            fi
            echo "EPISODE=$EP" >> "$GITHUB_ENV"
            echo "Episode dari trigger file: $EP"
          else
            echo "Episode dari dispatch: $EPISODE"
          fi

      - name: Paket sistem
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q espeak-ng ffmpeg
          sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium

      - name: Install dependencies
        run: npm ci

      - name: Install alignment engine (Word-Timeline, no-save)
        run: npm install --no-save @remotion/install-whisper-cpp@4.0.489

      - name: Cache Kokoro venv + model
        uses: actions/cache@v4
        with:
          path: |
            ~/.binb/kokoro-venv
            ~/.cache/huggingface
          key: kokoro-linux-v1

      - name: Cache whisper.cpp + model align
        uses: actions/cache@v4
        with:
          path: /home/runner/binb-home/work/_whisper
          key: whisper-linux-1.5.5-base.en-v1

      - name: Install Kokoro TTS
        run: |
          if [ ! -x "$HOME/.binb/kokoro-venv/bin/python" ]; then
            python3 -m venv "$HOME/.binb/kokoro-venv"
            "$HOME/.binb/kokoro-venv/bin/pip" install --upgrade pip
            PYT_INDEX="https:"
            PYT_INDEX="${PYT_INDEX}//download.pytorch.org/whl/cpu"
            "$HOME/.binb/kokoro-venv/bin/pip" install torch --index-url "$PYT_INDEX"
            "$HOME/.binb/kokoro-venv/bin/pip" install "kokoro==0.7.16" soundfile || "$HOME/.binb/kokoro-venv/bin/pip" install kokoro soundfile
          fi

      - name: Siapkan BINB_HOME dan kunci aset
        run: |
          mkdir -p "$BINB_HOME/tools"
          cp -r episodes "$BINB_HOME/episodes"
          printf '{"pexelsApiKey":"%s"}' "$PEXELS_API_KEY" > tools/assets-keys.json
          cp tools/assets-keys.json "$BINB_HOME/tools/assets-keys.json"

      - name: Fetch aset media
        run: node tools/assets-fetch.mjs "$EPISODE"

      - name: Lock episode
        run: node app/cli/binb.mjs lock "$EPISODE"

      - name: Build penuh
        run: |
          set -o pipefail
          node app/cli/binb.mjs build "$EPISODE" 2>&1 | tee build.log

      - name: Laporkan log gagal ke D1
        if: failure()
        run: node tools/report-failure.mjs

      - name: Upload video matang
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EPISODE }}-publish
          path: /home/runner/binb-home/publish/**
          if-no-files-found: error
          retention-days: 14

      - name: Terbitkan ke Releases (bank matang)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bank-${EPISODE}-r${GITHUB_RUN_NUMBER}"
          FILES=$(find "$BINB_HOME/publish" -type f)
          if [ -z "$FILES" ]; then
            echo "ERROR: tidak ada file di $BINB_HOME/publish"
            exit 1
          fi
          gh release create "$TAG" $FILES --title "$TAG" --notes "Bank matang episode $EPISODE (run $GITHUB_RUN_NUMBER, commit $GITHUB_SHA)"
          echo "Release terbit: $TAG"
