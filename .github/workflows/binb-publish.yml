name: BinB Publish
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode ID, contoh costco-hot-dog (langsung tayang, abaikan jadwal)
        required: true
  schedule:
    - cron: "5 22 * * *"
  push:
    branches:
      - main
    paths:
      - trigger/publish-request.json

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      EPISODE: ${{ inputs.episode }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "2336f3c9ddcd5227f2493258fc355327"
      R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
      R2_BUCKET: binb-publish
      GRAPH_HOST: graph.instagram.com
      GRAPH_VERSION: v23.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tentukan episode, jadwal, dan status antrean
        run: |
          GRAPH="https:"
          GRAPH="${GRAPH}//${GRAPH_HOST}/${GRAPH_VERSION}"
          echo "GRAPH=$GRAPH" >> "$GITHUB_ENV"
          if [ -n "$EPISODE" ]; then
            echo "SOURCE=dispatch" >> "$GITHUB_ENV"
            echo "Episode dari dispatch (langsung tayang): $EPISODE"
            exit 0
          fi
          echo "SOURCE=trigger" >> "$GITHUB_ENV"
          if [ ! -f trigger/publish-request.json ]; then
            echo "Tidak ada antrean publish. Selesai tanpa aksi."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          EP=$(node -p "JSON.parse(require('fs').readFileSync('trigger/publish-request.json','utf8')).episode || ''")
          DONE=$(node -p "JSON.parse(require('fs').readFileSync('trigger/publish-request.json','utf8')).done ? 'yes' : 'no'")
          WAIT=$(node -p "const nb=JSON.parse(require('fs').readFileSync('trigger/publish-request.json','utf8')).notBefore; (nb && Date.now() < Date.parse(nb)) ? 'yes' : 'no'")
          NB=$(node -p "JSON.parse(require('fs').readFileSync('trigger/publish-request.json','utf8')).notBefore || '-'")
          if [ -z "$EP" ]; then
            echo "ERROR: trigger/publish-request.json tidak berisi field episode yang valid"
            exit 1
          fi
          if [ "$DONE" = "yes" ]; then
            echo "Antrean $EP sudah pernah ditayangkan (done=true). Selesai tanpa aksi."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$WAIT" = "yes" ]; then
            echo "Antrean $EP belum jatuh tempo (notBefore=$NB). Menunggu cron berikutnya."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "EPISODE=$EP" >> "$GITHUB_ENV"
          echo "Episode dari antrean: $EP (notBefore=$NB, jatuh tempo)"

      - name: Validasi prasyarat
        if: env.SKIP != 'true'
        run: |
          MISSING=""
          [ -z "$IG_USER_ID" ] && MISSING="$MISSING IG_USER_ID(secret)"
          [ -z "$IG_ACCESS_TOKEN" ] && MISSING="$MISSING IG_ACCESS_TOKEN(secret)"
          [ -z "$R2_PUBLIC_BASE" ] && MISSING="$MISSING R2_PUBLIC_BASE(variable)"
          if [ -n "$MISSING" ]; then
            echo "ERROR: konfigurasi belum lengkap:$MISSING"
            exit 1
          fi
          echo "Prasyarat lengkap."

      - name: Unduh rilis matang terbaru
        if: env.SKIP != 'true'
        run: |
          NUM=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E "^bank-${EPISODE}-r[0-9]+$" | sed "s/^bank-${EPISODE}-r//" | sort -n | tail -1)
          if [ -z "$NUM" ]; then
            echo "ERROR: tidak ada rilis bank-${EPISODE}-r<N> di repo ini"
            exit 1
          fi
          TAG="bank-${EPISODE}-r${NUM}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" --pattern "*publish-ready.mp4" --dir dl
          FILE=$(find dl -name "*publish-ready.mp4" | head -1)
          if [ -z "$FILE" ]; then
            echo "ERROR: aset *publish-ready.mp4 tidak ditemukan di rilis $TAG"
            exit 1
          fi
          echo "VIDEO_FILE=$FILE" >> "$GITHUB_ENV"
          echo "Rilis dipakai: $TAG -> $FILE"

      - name: Siapkan caption dari packaging episode
        if: env.SKIP != 'true'
        run: |
          node -e "const p=require('./episodes/'+process.env.EPISODE+'/episode.json').packaging; if(!p||!p.instagramCaption){console.error('ERROR: packaging.instagramCaption tidak ada');process.exit(1)} require('fs').writeFileSync('caption.txt',p.instagramCaption)"
          echo "Caption siap ($(wc -c < caption.txt) byte)."

      - name: Upload video ke R2 (etalase publik)
        if: env.SKIP != 'true'
        run: |
          KEY="${TAG}.mp4"
          npx --yes wrangler@3 r2 object put "${R2_BUCKET}/${KEY}" --file "$VIDEO_FILE" --content-type video/mp4
          BASE="${R2_PUBLIC_BASE%/}"
          echo "VIDEO_URL=${BASE}/${KEY}" >> "$GITHUB_ENV"
          echo "Video tersedia di etalase R2 dengan key ${KEY}"

      - name: Buat container Reels
        if: env.SKIP != 'true'
        run: |
          RES=$(curl -s -X POST "${GRAPH}/${IG_USER_ID}/media" --data-urlencode "media_type=REELS" --data-urlencode "video_url=${VIDEO_URL}" --data-urlencode "caption@caption.txt" --data-urlencode "access_token=${IG_ACCESS_TOKEN}")
          CID=$(echo "$RES" | node -p "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); j.id || ''")
          if [ -z "$CID" ]; then
            echo "ERROR: gagal membuat container Reels. Respons API:"
            echo "$RES" | node -p "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); JSON.stringify(j.error||j,null,2)"
            exit 1
          fi
          echo "CREATION_ID=$CID" >> "$GITHUB_ENV"
          echo "Container dibuat: $CID"

      - name: Tunggu container siap
        if: env.SKIP != 'true'
        run: |
          STATUS=UNKNOWN
          for i in $(seq 1 30); do
            STATUS=$(curl -s "${GRAPH}/${CREATION_ID}?fields=status_code&access_token=${IG_ACCESS_TOKEN}" | node -p "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); j.status_code || 'UNKNOWN'")
            echo "Cek $i: status container = $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then break; fi
            if [ "$STATUS" = "ERROR" ]; then
              echo "ERROR: pemrosesan container gagal di sisi Instagram"
              exit 1
            fi
            sleep 10
          done
          if [ "$STATUS" != "FINISHED" ]; then
            echo "ERROR: timeout menunggu container (status terakhir: $STATUS)"
            exit 1
          fi

      - name: Publish Reels
        if: env.SKIP != 'true'
        run: |
          RES=$(curl -s -X POST "${GRAPH}/${IG_USER_ID}/media_publish" --data-urlencode "creation_id=${CREATION_ID}" --data-urlencode "access_token=${IG_ACCESS_TOKEN}")
          MEDIA_ID=$(echo "$RES" | node -p "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); j.id || ''")
          if [ -z "$MEDIA_ID" ]; then
            echo "ERROR: publish gagal. Respons API:"
            echo "$RES" | node -p "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); JSON.stringify(j.error||j,null,2)"
            exit 1
          fi
          echo "SUKSES: Reels tayang. Media ID: $MEDIA_ID (episode $EPISODE, rilis $TAG)"

      - name: Tandai antrean selesai (anti tayang ganda)
        if: env.SKIP != 'true' && env.SOURCE == 'trigger'
        run: |
          node -e "const f='trigger/publish-request.json'; const t=JSON.parse(require('fs').readFileSync(f,'utf8')); t.done=true; t.publishedAt=new Date().toISOString(); require('fs').writeFileSync('done.json', JSON.stringify(t,null,2)+'\n')"
          CONTENT=$(base64 -w0 done.json)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/trigger/publish-request.json" --jq .sha)
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/trigger/publish-request.json" -f message="publish done: ${EPISODE} [skip ci]" -f content="$CONTENT" -f sha="$SHA" > /dev/null
          echo "Antrean ditandai done=true."
