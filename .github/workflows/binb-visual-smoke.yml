name: binb-visual-smoke

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Workers AI smoke test
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          P="https"
          H="api.cloudflare.com"
          ACC="2336f3c9ddcd5227f2493258fc355327"
          BASE="${P}://${H}/client/v4"
          mkdir -p smoke
          date -u > smoke/RESULT.txt
          echo "== token verify ==" >> smoke/RESULT.txt
          curl -s "${BASE}/user/tokens/verify" -H "Authorization: Bearer ${CF_TOKEN}" >> smoke/RESULT.txt
          echo "" >> smoke/RESULT.txt
          echo "== sdxl generate ==" >> smoke/RESULT.txt
          curl -s -X POST "${BASE}/accounts/${ACC}/ai/run/@cf/bytedance/stable-diffusion-xl-lightning" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"prompt":"minimal editorial still life, warm paper texture, soft daylight, no text","negative_prompt":"text, letters, words, watermark, people, faces, hands","width":832,"height":1472,"num_steps":20,"guidance":7.5}' \
            -o smoke/cf_test.png
          SIZE=$(stat -c%s smoke/cf_test.png)
          echo "image_bytes=${SIZE}" >> smoke/RESULT.txt
          if [ "${SIZE}" -lt 4096 ]; then
            echo "== error body ==" >> smoke/RESULT.txt
            cat smoke/cf_test.png >> smoke/RESULT.txt
            echo "" >> smoke/RESULT.txt
            rm -f smoke/cf_test.png
          fi
          file smoke/cf_test.png >> smoke/RESULT.txt 2>/dev/null || true
      - name: Commit result
        run: |
          git config user.name "binb-bot"
          git config user.email "binb-bot@users.noreply.github.com"
          git add smoke
          git commit -m "ci: workers ai smoke test result"
          git push
